<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Cine-Flow — Mất kết nối</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #e5e5e5;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
        padding: 16px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 20px 0 8px;
        color: #fff;
      }
      p {
        margin: 0 0 24px;
        color: #a3a3a3;
        font-size: 14px;
      }
      button {
        background: #e50914;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Bạn đang offline</h1>
      <p>Kiểm tra kết nối mạng rồi thử lại nhé.</p>
      <button onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
