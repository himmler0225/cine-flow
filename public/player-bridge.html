<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CineFlow Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
    <style>
      html,
      body,
      video {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }
      video {
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <video id="v" controls playsinline autoplay></video>
    <script>
      const params = new URLSearchParams(location.search);
      const src = params.get("url") || "";
      const start = Number(params.get("t") || 0);
      const video = document.getElementById("v");
      let hls = null;
      let startApplied = false;

      function post(type, payload) {
        parent.postMessage({ source: "cineflow-bridge", type, ...(payload || {}) }, "*");
      }

      function seekTo(time) {
        if (!Number.isFinite(time) || time < 0) return;
        const dur =
          Number.isFinite(video.duration) && video.duration > 0 ? video.duration : time + 1;
        const target = Math.min(time, Math.max(0, dur - 0.25));
        try {
          video.currentTime = target;
        } catch (_) {}
        void video.play().catch(() => {});
        post("time", {
          currentTime: video.currentTime || target,
          duration: video.duration || dur,
        });
      }

      function applyStart() {
        if (startApplied || !(start > 0)) return;
        if (!Number.isFinite(video.duration) || video.duration <= 0) return;
        startApplied = true;
        seekTo(start);
      }

      function load() {
        if (!src) {
          post("error", { message: "missing url" });
          return;
        }
        if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = src;
        } else if (window.Hls && Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(src);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            applyStart();
            void video.play().catch(() => {});
          });
          hls.on(Hls.Events.ERROR, (_e, data) => {
            if (!data.fatal) return;
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
            else post("error", { message: data.details || "hls fatal" });
          });
        } else {
          video.src = src;
        }
      }

      video.addEventListener("loadedmetadata", applyStart);
      video.addEventListener("canplay", applyStart);
      video.addEventListener("timeupdate", () => {
        post("time", {
          currentTime: video.currentTime || 0,
          duration: video.duration || 0,
        });
      });
      video.addEventListener("seeked", () => {
        post("time", {
          currentTime: video.currentTime || 0,
          duration: video.duration || 0,
        });
      });
      video.addEventListener("ended", () => post("ended", {}));
      video.addEventListener("error", () => post("error", { message: "video error" }));

      window.addEventListener("message", (ev) => {
        const d = ev.data;
        if (!d || d.target !== "cineflow-bridge") return;
        if (d.type === "seek" && typeof d.time === "number") seekTo(d.time);
        if (d.type === "play") void video.play().catch(() => {});
        if (d.type === "pause") video.pause();
      });

      window.addEventListener("beforeunload", () => {
        if (hls) hls.destroy();
      });

      load();
    </script>
  </body>
</html>
